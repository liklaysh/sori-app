name: Release Desktop Builds

on:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis --ci
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg --ci --no-sign

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Prepare updater release config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const baseConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const publicKey = process.env.TAURI_UPDATER_PUBLIC_KEY || baseConfig.plugins?.updater?.pubkey;

          if (!publicKey) {
            throw new Error('Updater public key is missing from TAURI_UPDATER_PUBLIC_KEY or tauri.conf.json');
          }

          const config = {
            bundle: {
              createUpdaterArtifacts: true
            },
            plugins: {
              updater: {
                pubkey: publicKey,
                endpoints: [
                  'https://github.com/liklaysh/sori-app/releases/latest/download/latest.json'
                ],
                windows: {
                  installMode: 'passive'
                }
              }
            }
          };

          fs.writeFileSync('src-tauri/tauri.release.conf.json', JSON.stringify(config, null, 2));
          NODE

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SORI App ${{ github.ref_name }}
          releaseBody: See release notes for this version.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
